name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Cache Maven dependencies to speed up builds
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make mvnw executable
        run: chmod +x mvnw

      # 4. Build and run tests
      - name: Build and Test with Maven
        run: ./mvnw clean verify -B

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test # Only run if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Gateway Image
      - name: Build Gateway Docker Image
        run: docker build -t flashsale-gateway:latest -f gateway/Dockerfile .

      # Build Auth Service Image
      - name: Build Auth Service Docker Image
        run: docker build -t flashsale-auth:latest -f auth-service/Dockerfile .

      # Build Booking Service Image
      - name: Build Booking Service Docker Image
        run: docker build -t flashsale-booking:latest -f booking-service/Dockerfile .

      # Build Notification Service Image
      - name: Build Notification Service Docker Image
        run: docker build -t flashsale-notification:latest -f notification-service/Dockerfile .