server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # Configuración global de CORS (necesaria para frontend)
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"

          # Filtros que se aplican a todas las rutas
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

          # Definición de rutas
          routes:
            - id: auth_route
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
              metadata:
                public: true

            - id: booking_route
              uri: http://localhost:8082
              predicates:
                - Path=/api/bookings/**
              metadata:
                public: false

app:
  jwt:
    secret: YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong123456789

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.flashsale.gateway: DEBUG